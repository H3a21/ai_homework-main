services:
  mysql:
    ports: !reset []
  redis:
    ports: !reset []
  rabbitmq:
    ports: !reset []
  minio:
    ports: !reset []
  backend:
    ports: !reset []
  ocr:
    ports: !reset []
  prometheus:
    ports: !reset []
  grafana:
    ports: !reset []
  frontend:
    ports: !override
      - "80:80"
      - "443:443"
    command:
      - /bin/sh
      - -c
      - >-
        rm -f /etc/nginx/conf.d/default.conf &&
        envsubst '$$TLS_SERVER_NAME' < /etc/nginx/templates/default.conf.template
        > /etc/nginx/conf.d/default.conf &&
        nginx -g 'daemon off;'
    environment:
      TLS_SERVER_NAME: ${TLS_SERVER_NAME:?set TLS_SERVER_NAME}
    volumes:
      - ./deploy/nginx-tls.conf:/etc/nginx/templates/default.conf.template:ro
      - ${TLS_CERT_DIR:?set TLS_CERT_DIR}:/etc/nginx/tls:ro
